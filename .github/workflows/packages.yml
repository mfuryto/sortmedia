name: Package validation

on:
  push:
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl python3-pil python3-tomli ffmpeg
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: ./scripts/build-deb.sh && dpkg-deb --info dist/*.deb
      - run: sudo apt-get install -y ./dist/*.deb && sortmedia --version
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y rpm-build python3 python3-pillow perl-Image-ExifTool tar gzip findutils
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: ./scripts/build-rpm.sh && rpm -qip dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm base-devel python python-pillow perl-image-exiftool
      - run: useradd -m builder && chown -R builder:builder .
      - run: tar --transform='s,^,sortmedia-0.2.0/,' -czf packaging/arch/sortmedia-0.2.0.tar.gz LICENSE README.md bin src man
      - run: su builder -c 'cd packaging/arch && makepkg --noconfirm'
      - run: pacman -Qip packaging/arch/*.pkg.tar.*
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.*

  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add alpine-sdk python3 py3-pillow exiftool
      - run: adduser -D builder && addgroup builder abuild && chown -R builder:abuild .
      - run: tar --transform='s,^,sortmedia-0.2.0/,' -czf packaging/alpine/sortmedia-0.2.0.tar.gz LICENSE README.md bin src man
      - run: su builder -c 'abuild-keygen -a -n'
      - run: cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
      - run: su builder -c 'cd packaging/alpine && abuild checksum && abuild -r'
