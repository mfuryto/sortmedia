# Relative paths are resolved from the directory containing this config file.
folder = "incoming"
destination = "."
recursive = false

# preview, move, or copy. Always start with preview.
operation = "preview"
layout = "{year}/{month}/{day}"
filename = "{date}_{time}_{original}"
duplicates = "hash"
timezone = "local"
# ymd: year first only. Opt in to dmy or mdy for year-last filename dates.
filename_date_order = "ymd"
perceptual_duplicates = false
live_photo_videos = "include"

# Names match anywhere; paths are source-relative. ** spans directory levels.
exclude_folders = []
