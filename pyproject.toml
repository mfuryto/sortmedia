[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortmedia"
version = "0.1.0"
description = "Safely organize media with directory-local configs, companion awareness, duplicate detection, and undo"
requires-python = ">=3.11"

[project.scripts]
sortmedia = "sortmedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
