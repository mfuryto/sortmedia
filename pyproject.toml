[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortmedia"
version = "0.2.3"
description = "Safely organize media with directory-local configs, companion awareness, duplicate detection, and undo"
requires-python = ">=3.10"
dependencies = [
    'tomli>=1.2.2; python_version < "3.11"',
]

[project.scripts]
sortmedia = "sortmedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
